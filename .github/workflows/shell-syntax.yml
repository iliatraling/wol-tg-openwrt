name: Shell syntax

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: |
          set -eu
          find . -type f \( -name '*.sh' -o -path '*/usr/bin/wol-gateway' -o -path '*/etc/init.d/wol-gateway' -o -path '*/usr/libexec/rpcd/luci.wol-gateway' \) -print |
          while IFS= read -r file; do
            echo "Checking $file"
            sh -n "$file"
          done
      - name: Validate package JSON
        run: |
          python3 -m json.tool packages/luci-app-wol-gateway/files/usr/share/rpcd/acl.d/luci-app-wol-gateway.json >/dev/null
          python3 -m json.tool packages/luci-app-wol-gateway/files/usr/share/luci/menu.d/luci-app-wol-gateway.json >/dev/null
